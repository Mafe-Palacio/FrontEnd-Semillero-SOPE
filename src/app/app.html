<!-- 1. SI ESTAMOS EN EL LOGIN: Solo mostramos la pantalla completa sin menú -->
<ng-container *ngIf="isAuthRoute">
  <router-outlet></router-outlet>
</ng-container>

<!-- 2. SI NO ESTAMOS EN EL LOGIN: Mostramos el panel administrativo -->
<mat-sidenav-container class="sidenav-container" *ngIf="!isAuthRoute">
  
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="logo-container">
      <img src="ahttps://www.grupolarabida.org/wp-content/uploads/2020/10/Colombia_InstitutoTecnologicoMetropolitano_ITM_81_.jpg" alt="Logo ITM" class="institucional-logo">
      <h2>Semillero SOPE</h2>
      <p>Objetos Perdidos</p>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard"><mat-icon matListItemIcon>dashboard</mat-icon><div matListItemTitle>Inicio</div></a>
      <a mat-list-item routerLink="/custodia"><mat-icon matListItemIcon>inventory_2</mat-icon><div matListItemTitle>En Custodia</div></a>
      <a mat-list-item routerLink="/reclamos"><mat-icon matListItemIcon>assignment</mat-icon><div matListItemTitle>Reclamos</div></a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="institucional-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()"><mat-icon>menu</mat-icon></button>
      <span>Panel Administrativo</span>
      <span class="spacer"></span>
      <button mat-button><mat-icon>logout</mat-icon>Salir</button>
    </mat-toolbar>

    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
